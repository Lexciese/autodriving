# conda env create -f environment.yml
name: autodriving
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - openblas
  - numpy
  - scipy
  - pathlib
  - pandas
  - tqdm
  - matplotlib
  - pillow
  - opencv
  - h5py
  - hdf5plugin
  - pip:
    - nvidia-cusparselt-cu12
    - https://developer.download.nvidia.com/compute/redist/jp/v61/pytorch/torch-2.5.0a0+872d972e41.nv24.08.17622132-cp310-cp310-linux_aarch64.whl
    - pypcd4
    - pyyaml
    - lz4
    - rosbags
    - plotly
    - dash
